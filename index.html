    <script>
      // Safeguard against third-party or polyfill libraries attempting to redefine window.fetch on strict getters
      (function() {
        try {
          if (typeof window !== "undefined") {
            const originalFetch = window.fetch ? window.fetch.bind(window) : undefined;
            let currentFetch = originalFetch;
            try {
              Object.defineProperty(window, "fetch", {
                get: function() {
                  return currentFetch;
                },
                set: function(fn) {
                  currentFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e) {
              // If defineProperty fails, window.fetch remains default
            }
          }
        } catch (_) {}
